[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-apply-agent"
version = "0.1.0"
description = "A personal AI agent (Claude Agent SDK) that helps you apply to jobs. Phase 1: tailor your resume to a job posting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.170",
    # Bundles the pandoc binary, so DOCX <-> Markdown works without a system install.
    "pypandoc-binary>=1.13",
]

[project.optional-dependencies]
# DOCX -> PDF through Microsoft Word (Windows/macOS) when LibreOffice is not installed.
word = ["docx2pdf>=0.1.8"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "python-docx>=1.1"]

[project.scripts]
job-agent = "job_apply_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_apply_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
